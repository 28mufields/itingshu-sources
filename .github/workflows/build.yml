name: Inspect TingShu Source Structure

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CustomSources
        uses: actions/checkout@v4
        with:
          repository: eprendre/tingshu
          ref: master

      - name: Dump Template Source Files
        run: |
          echo "=== 1. BUILD GRADLE ==="
          cat CustomSources/build.gradle || true
          echo ""
          echo "=== 2. ALL KOTLIN FILES IN REPO ==="
          find CustomSources/src/main/kotlin -name "*.kt" -exec echo "--- FILE: {} ---" \; -exec cat {} \;
