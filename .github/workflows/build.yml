name: Build TingShu Jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CustomSources
        uses: actions/checkout@v4
        with:
          repository: eprendre/tingshu
          ref: master

      - name: Set up JDK 18
        uses: actions/setup-java@v5
        with:
          java-version: '18'
          distribution: 'zulu'

      - name: Prepare Directories and Source Code
        run: |
          mkdir -p CustomSources/src/main/kotlin/sources_by_itingshu
          sed -i 's/MY_SOURCES_PACKAGE=.*/MY_SOURCES_PACKAGE=sources_by_itingshu/' CustomSources/gradle.properties

          cat << 'EOF' > CustomSources/src/main/kotlin/sources_by_itingshu/SourceEntry.kt
          package sources_by_itingshu

          import com.github.eprendre.tingshu.sources.TingShu

          class SourceEntry {
              companion object {
                  @JvmStatic
                  fun getSources(): List<TingShu> {
                      return listOf(ITingShu)
                  }
              }
          }
          EOF

          cat << 'EOF' > CustomSources/src/main/kotlin/sources_by_itingshu/ITingShu.kt
          package sources_by_itingshu

          import com.github.eprendre.tingshu.sources.*
          import com.github.kittinunf.fuel.Fuel
          import org.json.JSONObject
          import org.jsoup.Jsoup
          import java.net.URLEncoder
          import kotlin.random.Random

          object ITingShu : TingShu() {
              override val name = "爱听书"
              override val isUniqueCover = true
              override val isSearchable = true
              override val isCategorySupport = true
              override val tag = "itingshu"
              override val desc = "爱听书(itingshu.net)原生免WebView音源"

              private const val BASE_URL = "https://www.itingshu.net"
              private const val USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              private const val ENCRYPT_TABLE = "PXhw7U1B0a9kQDKZsTjIASmOeNzxYG4CHo1JyRfg2b8FLpEvr3FtVnlqMidu6c"

              override fun getCategoryMenus(): List<CategoryMenu> {
                  val items = ArrayList<CategoryItem>()
                  items.add(CategoryItem("玄幻修真", "$BASE_URL/yousheng/xuanhuan/lastupdate.html"))
                  items.add(CategoryItem("都市言情", "$BASE_URL/yousheng/dushi/lastupdate.html"))
                  items.add(CategoryItem("灵异惊悚", "$BASE_URL/yousheng/lingyi/lastupdate.html"))
                  items.add(CategoryItem("军事历史", "$BASE_URL/yousheng/junshi/lastupdate.html"))
                  items.add(CategoryItem("长篇评书", "$BASE_URL/yousheng/pingshu/lastupdate.html"))
                  items.add(CategoryItem("儿童故事", "$BASE_URL/yousheng/ertong/lastupdate.html"))
                  items.add(CategoryItem("网游竞技", "$BASE_URL/yousheng/wangyou/lastupdate.html"))
                  items.add(CategoryItem("官场商战", "$BASE_URL/yousheng/guanchang/lastupdate.html"))
                  items.add(CategoryItem("相声戏曲", "$BASE_URL/yousheng/xiangsheng/lastupdate.html"))
                  items.add(CategoryItem("经典纪实", "$BASE_URL/yousheng/jishi/lastupdate.html"))
                  return listOf(CategoryMenu("分类", items))
              }

              override fun getCategoryList(url: String, page: Int): CategoryResult {
                  val currentUrl = if (page == 1) url else url.replace(".html", "/$page.html")
                  val html = Fuel.get(currentUrl)
                      .header("User-Agent", USER_AGENT)
                      .header("Referer", BASE_URL)
                      .responseString().third.get()

                  val doc = Jsoup.parse(html)
                  val list = ArrayList<Book>()
                  val elements = doc.select("div.list_item, dl.book-item, div.item")

                  elements.forEach { el ->
                      val titleEl = el.selectFirst("h3.title a, a.name") ?: return@forEach
                      val title = titleEl.text().trim()
                      val href = titleEl.attr("href")
                      val bookUrl = if (href.startsWith("http")) href else BASE_URL + href
                      val coverUrl = el.selectFirst("img")?.let { img ->
                          val src = img.attr("data-original").ifEmpty { img.attr("src") }
                          if (src.startsWith("//")) "https:$src" else src
                      } ?: ""
                      val artist = el.selectFirst("p.actor, span.author")?.text()?.replace("演播：", "")?.trim() ?: ""
                      val intro = el.selectFirst("p.desc, p.intro")?.text()?.trim() ?: ""

                      list.add(Book(coverUrl, bookUrl, title, artist, intro))
                  }
                  return CategoryResult(list, page, page + 1)
              }

              override fun search(keywords: String, page: Int): SearchResult {
                  val searchUrl = "$BASE_URL/novelsearch/search/result.html"
                  val formBody = "searchword=${URLEncoder.encode(keywords, "UTF-8")}&page=$page&searchtype=0"

                  val html = Fuel.post(searchUrl)
                      .header("User-Agent", USER_AGENT)
                      .header("Content-Type", "application/x-www-form-urlencoded")
                      .header("Referer", BASE_URL)
                      .body(formBody)
                      .responseString().third.get()

                  val doc = Jsoup.parse(html)
                  val list = ArrayList<Book>()
                  val elements = doc.select("div.search-list div.list_item, div.book-list dl, div.list_item")

                  elements.forEach { el ->
                      val titleEl = el.selectFirst("h3.title a, a.name") ?: return@forEach
                      val title = titleEl.text().trim()
                      val href = titleEl.attr("href")
                      val bookUrl = if (href.startsWith("http")) href else BASE_URL + href
                      val coverUrl = el.selectFirst("img")?.let { img ->
                          val src = img.attr("data-original").ifEmpty { img.attr("src") }
                          if (src.startsWith("//")) "https:$src" else src
                      } ?: ""
                      val artist = el.selectFirst("p.actor, span.author")?.text()?.replace("演播：", "")?.trim() ?: ""
                      val intro = el.selectFirst("p.desc, p.intro")?.text()?.trim() ?: ""

                      list.add(Book(coverUrl, bookUrl, title, artist, intro))
                  }
                  return SearchResult(list, page, page + 1)
              }

              override fun getBookDetailInfo(book: Book): BookDetail {
                  val detailHtml = Fuel.get(book.bookUrl)
                      .header("User-Agent", USER_AGENT)
                      .header("Referer", BASE_URL)
                      .responseString().third.get()

                  val detailDoc = Jsoup.parse(detailHtml)
                  val intro = detailDoc.selectFirst("dd.list-book-des, div.intro, p.desc")?.text()?.trim() ?: book.intro

                  val playlistHref = detailDoc.selectFirst("a[href*='/itingshus/']")?.attr("href") ?: ""
                  val playlistBaseUrl = if (playlistHref.startsWith("http")) playlistHref else BASE_URL + playlistHref

                  val episodes = ArrayList<Episode>()
                  var currentPage = 1
                  while (true) {
                      val pageUrl = "$playlistBaseUrl?page=$currentPage&sort=asc"
                      try {
                          val pageHtml = Fuel.get(pageUrl)
                              .header("User-Agent", USER_AGENT)
                              .header("Referer", book.bookUrl)
                              .responseString().third.get()

                          val pageDoc = Jsoup.parse(pageHtml)
                          val items = pageDoc.select("ul.playlist li a, div.play-list a, a[href*='/play/']")
                          if (items.isEmpty()) break

                          var newCount = 0
                          items.forEach { a ->
                              val href = a.attr("href")
                              if (href.contains("/play/")) {
                                  val title = a.text().trim()
                                  val playUrl = if (href.startsWith("http")) href else BASE_URL + href
                                  episodes.add(Episode(title, playUrl))
                                  newCount++
                              }
                          }
                          if (newCount < 50) break
                          currentPage++
                      } catch (e: Exception) {
                          break
                      }
                  }
                  return BookDetail(book, episodes, intro)
              }

              override fun getAudioUrl(episode: Episode): AudioUrlResult {
                  val html = Fuel.get(episode.url)
                      .header("User-Agent", USER_AGENT)
                      .header("Referer", BASE_URL)
                      .responseString().third.get()

                  val doc = Jsoup.parse(html)
                  val metaB = doc.selectFirst("meta[name=_b]")?.attr("content") ?: ""
                  val metaP = doc.selectFirst("meta[name=_p]")?.attr("content") ?: ""
                  val metaC = doc.selectFirst("meta[name=_c]")?.attr("content") ?: ""
                  val metaD = doc.selectFirst("meta[name=_d]")?.attr("content") ?: "read"

                  val spHeader = encodeSp(metaP)
                  val apiUrl = "$BASE_URL/api/mapi/play"
                  val postData = "nid=$metaB&cid=$metaC&sort=$metaD"

                  val jsonStr = Fuel.post(apiUrl)
                      .header("User-Agent", USER_AGENT)
                      .header("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8")
                      .header("X-Requested-With", "XMLHttpRequest")
                      .header("Referer", episode.url)
                      .header("sc", metaC)
                      .header("sp", spHeader)
                      .body(postData)
                      .responseString().third.get()

                  val json = JSONObject(jsonStr)
                  val audioUrl = json.optString("m4a").ifEmpty { json.optString("mp3") }

                  val headers = HashMap<String, String>()
                  headers["Referer"] = BASE_URL
                  headers["User-Agent"] = USER_AGENT

                  return AudioUrlResult(audioUrl, headers)
              }

              private fun encodeSp(raw: String): String {
                  val sb = StringBuilder()
                  for (c in raw) {
                      val idx = ENCRYPT_TABLE.indexOf(c)
                      val shifted = if (idx == -1) c else ENCRYPT_TABLE[(idx + 3) % 62]
                      val r1 = ENCRYPT_TABLE[Random.nextInt(62)]
                      val r2 = ENCRYPT_TABLE[Random.nextInt(62)]
                      sb.append(r1).append(shifted).append(r2)
                  }
                  return sb.toString()
              }
          }
          EOF

      - name: Build with Gradle and D8
        run: |
          chmod +x CustomSources/gradlew dx/d8
          cd CustomSources
          ./gradlew jar --no-daemon --stacktrace
          cd ..
          if [ -f "dx/d8" ]; then
            ./dx/d8 --output sources_by_itingshu.jar CustomSources/build/libs/CustomSources-1.0-SNAPSHOT.jar
          fi
          find . -name "sources_by_itingshu.jar" -exec cp {} ./sources_by_itingshu.jar \;

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sources_by_itingshu
          path: sources_by_itingshu.jar
